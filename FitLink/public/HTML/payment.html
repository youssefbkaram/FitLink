<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>الدفع | FitLink</title>
  <link rel="stylesheet" href="../CSS/general.css" />
  <link rel="stylesheet" href="../CSS/navbar.css" />
  <link rel="stylesheet" href="../CSS/payment.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap"/>
</head>
<body>
  <div id="navbar-container"></div>
  <main>
    <div class="container">
      <div class="payment-box">
        <h2><i class="fas fa-credit-card"></i> الدفع والاشتراك</h2>
        <div id="academy-summary" class="academy-summary"></div>
        <form id="payment-form" class="payment-form">
          <div class="form-group">
            <label>طريقة الدفع</label>
            <div class="payment-methods">
              <label>
                <input type="radio" name="payment-method" value="card" checked />
                <i class="fas fa-credit-card"></i> بطاقة بنكية
              </label>
              <label>
                <input type="radio" name="payment-method" value="bank" />
                <i class="fas fa-university"></i> تحويل بنكي
              </label>
            </div>
          </div>
          <div id="card-fields" class="form-group">
            <label>بيانات البطاقة البنكية</label>
            <input type="text" id="card-number" maxlength="19" placeholder="رقم البطاقة (16 رقم)" required />
            <div style="display:flex; gap:10px;">
              <input type="text" id="card-expiry" maxlength="5" placeholder="MM/YY" required style="flex:1;" />
              <input type="text" id="card-cvc" maxlength="4" placeholder="CVC" required style="flex:1;" />
            </div>
            <input type="text" id="card-holder" maxlength="40" placeholder="اسم حامل البطاقة" required />
          </div>
          <div id="bank-fields" class="form-group" style="display:none;">
            <label>بيانات التحويل البنكي</label>
            <input type="text" id="bank-name" placeholder="اسم البنك" />
            <input type="text" id="bank-ref" placeholder="رقم المرجع/الإيصال" />
            <small>سيتم مراجعة التحويل خلال 24 ساعة.</small>
          </div>
          <button type="submit" class="btn btn-primary-action" style="margin-top:18px;">
            <i class="fas fa-check-circle"></i> تأكيد الدفع والاشتراك
          </button>
          <div id="payment-msg" class="profile-msg"></div>
        </form>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="../JS/load_basics.js"></script>
  <script src="../JS/navbar.js"></script>
  <script src="../JS/payment.js"></script>
  <script src="../JS/footer.js"></script>
</body>
</html>
