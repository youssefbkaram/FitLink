<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLink - بوابتك للرياضة في مصر</title>
    <link rel="stylesheet" href="../CSS/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet">
  </head>

  <body>
    <div id="navbar-container"></div>

    <section id="login-form" class="page-section auth-form-section">
      <div class="container">
        <div class="content-box form-box">
          <a href="index.html" class="close-detail-btn"
            ><i class="fas fa-times-circle"></i> إغلاق</a
          >
          <h2>تسجيل الدخول</h2>
          <form id="login-form-actual">
            <div class="form-group">
              <label for="login-username"
                >اسم المستخدم أو البريد الإلكتروني:</label
              >
              <input type="text" id="login-username" required />
            </div>
            <div class="form-group">
              <label for="login-password">كلمة المرور:</label>
              <input type="password" id="login-password" required />
            </div>

            <!-- ✅ هنا الرسالة -->
            <div id="login-msg" class="flash-msg"></div>

            <button type="submit" class="btn-primary-action" id="login-submit">
              تسجيل الدخول
            </button>

            <p class="switch-auth-link">
              ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a>
            </p>
          </form>
        </div>
      </div>
    </section>

    <div id="footer-container"></div>

    <!-- navbar & footer scripts -->
    <script src="../JS/load_basics.js"></script>

    <!-- scripts -->
    <script src="../JS/login.js"></script>
    <script src="../JS/navbar.js" defer></script>
  <script src="../JS/footer.js"></script>
  </body>
</html>
