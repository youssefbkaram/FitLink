<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLink - بوابتك للرياضة في مصر</title>
    <link rel="stylesheet" href="../CSS/signup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
        <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet">
  </head>

  <body>
    <div id="navbar-container"></div>

    <section id="register-form" class="page-section auth-form-section">
      <div class="container">
        <div class="content-box form-box">
          <a href="index.html" class="close-detail-btn"
            ><i class="fas fa-times-circle"></i> إغلاق</a
          >
          <h2>إنشاء حساب جديد</h2>
          <form id="register-form-actual">
            <div class="form-group">
              <label for="reg-username">اسم المستخدم:</label>
              <input type="text" id="reg-username" required />
            </div>

            <div class="form-group">
              <label for="reg-email">البريد الإلكتروني:</label>
              <input type="email" id="reg-email" required />
            </div>

            <div class="form-group">
              <label for="reg-password">كلمة المرور:</label>
              <input type="password" id="reg-password" required />
            </div>

            <div class="form-group">
              <label for="reg-confirm-password">تأكيد كلمة المرور:</label>
              <input type="password" id="reg-confirm-password" required />
            </div>

            <div class="form-group">
              <label for="reg-age">السن:</label>
              <input type="number" id="reg-age" min="5" max="100" required />
            </div>

            <div class="form-group">
              <label for="reg-role">ما هو دورك؟</label>
              <select id="reg-role" required>
                <option value="">اختر</option>
                <option value="trainee">متدرب</option>
                <option value="parent">ولي أمر</option>
                <option value="coach">مدرب / أكاديمية</option>
              </select>
            </div>

            <div class="form-group">
              <label for="sports-select">ما الرياضات التي تفضلها؟</label>
              <select id="sports-select">
                <option value="">اختر رياضة</option>
                <option value="كرة القدم">كرة القدم</option>
                <option value="سباحة">سباحة</option>
                <option value="كاراتيه">كاراتيه</option>
                <option value="جيم">جيم</option>
                <option value="جودو">جودو</option>
                <option value="other">أخرى</option>
              </select>
              <input
                type="text"
                id="custom-sport-input"
                placeholder="اكتب الرياضة واضغط Enter"
                style="display: none; margin-top: 10px"
              />
              <ul id="selected-sports-list"></ul>
            </div>

            <div class="form-group">
              <label for="country">الدولة</label>
              <select id="country" name="country" required>
                <option value="">اختر الدولة</option>
                <option value="EG">مصر 🇪🇬</option>
                <option value="SA">السعودية 🇸🇦</option>
                <option value="AE">الإمارات 🇦🇪</option>
              </select>
            </div>

            <button type="submit" class="btn-primary-action">
              إنشاء الحساب
            </button>

            <p class="switch-auth-link">
              هل لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </p>
          </form>
        </div>
      </div>
    </section>

<div id="footer-container"></div>

    <!-- navbar & footer scripts -->
    <script src="../JS/load_basics.js"></script>

    <!-- scripts -->
    <script src="../JS/signup.js"></script>
    <script src="../JS/navbar.js"></script>
  <script src="../JS/footer.js"></script>
  </body>
</html>
